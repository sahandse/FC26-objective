name: FC27 Verified Players
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-fc27-players.cjs
      - name: Commit validated source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fc27-players.json
          if ! git diff --cached --quiet; then
            git commit -m "data(fc27): refresh verified EA base player snapshot"
            git push
          fi
