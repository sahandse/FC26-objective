name: Download Player Images

on:
  workflow_dispatch:
    inputs:
      force_redownload:
        description: 'Force re-download even if images already exist'
        required: false
        default: 'false'
        type: boolean

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clear existing images (if force redownload)
        if: inputs.force_redownload == 'true'
        run: rm -f img/players/*.png

      - name: Download player images via curl
        shell: bash
        run: |
          mkdir -p img/players

          # All verified EA player IDs
          IDS=(
            20801 158023 165153 167495 172779 173890 175177 177003 178603 179061
            182521 186345 188350 188545 189242 189596 190871 192985 193080 193169
            193669 194765 198001 199054 199503 199736 200104 200145 200389 200487
            201153 202126 203376 203460 204935 204963 205600 207865 207907 208128
            208179 208277 208690 209331 210035 210257 210514 211117 212198 212228
            212622 212831 213345 213513 213559 213566 215914 216267 217553 218350
            218667 220834 221015 221183 221458 222028 222038 222349 222492 222665
            224458 226225 229169 229490 230621 230899 231281 231323 231443 231458
            231677 231680 231683 231747 231866 231943 232411 232464 232580 232656
            232672 233731 233737 233837 233872 234378 234396 235073 235212 235674
            235714 236461 236595 237238 237679 237692 237750 237827 238074 238744
            238794 238815 239053 239085 239109 239814 239818 239837 239904 240395
            241096 241592 241626 241721 241745 241850 242444 242964 243271 243715
            243812 244260 244360 244722 244726 245364 245367 246187 246191 246469
            246529 246669 246672 247635 247851 248243 248734 248741 248792 249710
            249956 251566 251854 252371 252427 252971 253004 253072 254292 254640
            255253 256079 256380 256630 256790 256961 257534 257592 257799 257906
            258070 258128 258517 258751 261399 261418 261960 262704 262859 263490
            263516 263529 263549 263599 263631 263640 263685 264553 265421 265796
            266606 266607 269700 270566 272248 272336 272337 272339 273460 273593
            274560 277643
          )

          CDNS=(
            "https://cdn.futbin.com/content/fifa26/img/players/ID.png|https://www.futbin.com/"
            "https://cdn.fut.gg/fc26/players/portrait/ID.png|https://www.fut.gg/"
            "https://cdn.futbin.com/content/fifa25/img/players/ID.png|https://www.futbin.com/"
          )

          OK=0; SKIP=0; FAIL=0

          for ID in "${IDS[@]}"; do
            DEST="img/players/${ID}.png"
            if [ -f "$DEST" ]; then
              SKIP=$((SKIP+1))
              continue
            fi

            DOWNLOADED=0
            for CDN_ENTRY in "${CDNS[@]}"; do
              URL="${CDN_ENTRY%%|*}"
              URL="${URL//ID/$ID}"
              REF="${CDN_ENTRY##*|}"

              HTTP=$(curl -s -o "$DEST" -w "%{http_code}" \
                -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                -H "Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8" \
                -H "Accept-Language: en-US,en;q=0.9" \
                -H "Referer: $REF" \
                -H "Sec-Fetch-Dest: image" \
                -H "Sec-Fetch-Mode: no-cors" \
                -H "Sec-Fetch-Site: same-site" \
                --compressed --max-time 15 \
                "$URL" 2>/dev/null)

              if [ "$HTTP" = "200" ] && [ -s "$DEST" ]; then
                # Verify it's actually a PNG (not an error HTML page)
                if file "$DEST" | grep -q "PNG"; then
                  DOWNLOADED=1
                  OK=$((OK+1))
                  echo "✓ $ID ($URL)"
                  break
                fi
              fi
              rm -f "$DEST"
            done

            if [ "$DOWNLOADED" = "0" ]; then
              FAIL=$((FAIL+1))
              echo "✗ $ID"
            fi

            sleep 0.1
          done

          echo ""
          echo "Done: $OK downloaded, $SKIP skipped, $FAIL failed"

      - name: Count images
        run: |
          COUNT=$(ls img/players/*.png 2>/dev/null | wc -l)
          echo "Total images in img/players/: $COUNT"

      - name: Commit and push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/players/
          if git diff --staged --quiet; then
            echo "No new images to commit"
          else
            ADDED=$(git diff --staged --name-only | grep -c '\.png' || true)
            git commit -m "Add $ADDED player portrait images [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
