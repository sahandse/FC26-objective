name: FC27 Legacy Image Import (Verified Only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fc27-portrait-sync
  cancel-in-progress: false
jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified licensed FC27 portraits
        run: node scripts/sync-player-photos.cjs
      - name: Publish verified images with attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/players data/available-portraits.json data/player-photo-credits.json data/player-photo-attempts.json
          if ! git diff --cached --quiet; then
            git commit -m "images(fc27): import verified licensed portraits"
            git push origin HEAD:main
          fi
