name: FC27 Verified Market
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-fc27-market.cjs'
      - 'data/fc27-market-candidates.json'
      - '.github/workflows/fc27-market.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: fc27-market-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update verified FC27 market records
        run: node scripts/sync-fc27-market.cjs
      - name: Publish verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fc27-market-verified.json
          if ! git diff --cached --quiet; then
            git commit -m "data(fc27): refresh verified market prices"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
