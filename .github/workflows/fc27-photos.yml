name: FC27 Licensed Player Photos
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-player-photos.cjs'
      - '.github/workflows/fc27-photos.yml'
  schedule:
    - cron: '34 4 * * *'
permissions:
  contents: write
concurrency:
  group: fc27-portrait-sync
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch verified free-license photographs
        run: node scripts/sync-player-photos.cjs
      - name: Commit images and attribution safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in 1 2 3; do
            git add img/players data/available-portraits.json data/player-photo-credits.json data/player-photo-attempts.json
            if git diff --cached --quiet; then
              echo "No photo changes to publish"
              exit 0
            fi
            git commit -m "images(fc27): add verified freely licensed player portraits"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Portrait synchronization published"
              exit 0
            fi
            echo "Branch changed; retrying from newest verified data ($n/3)"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            node scripts/sync-player-photos.cjs
          done
          echo "Unable to publish after 3 attempts"
          exit 1
