name: FC27 Official News
on:
  push:
    paths:
      - '.github/workflows/fc27-news.yml'
      - 'scripts/sync-fc27-news.cjs'
  workflow_dispatch:
  schedule:
    - cron: '22 8,20 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install HTML parser
        run: npm install --no-save --no-package-lock cheerio@1.0.0
      - name: Sync EA verified news
        run: node scripts/sync-fc27-news.cjs
      - name: Commit only changed verified feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fc27-news.json
          if ! git diff --cached --quiet; then
            git commit -m "data(fc27): sync recent EA articles"
            git push
          fi
