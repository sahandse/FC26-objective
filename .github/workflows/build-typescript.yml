name: Build and deploy TypeScript FC27
on:
  push:
    branches:
      - claude/fc26-objectives-page-yAjCT
    paths:
      - 'index.html'
      - 'src/**'
      - 'data/**'
      - 'img/**'
      - 'scripts/copy-static.mjs'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-typescript.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fc27-typescript-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Compile TypeScript and check app
        run: |
          npm run check
          npm run build
          npm test
      - name: Publish Vite output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
