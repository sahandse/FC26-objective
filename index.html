<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اهداف FC26 | Objectives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #04090F;
      --bg1: #0B1220;
      --bg2: #101928;
      --bg3: #162235;
      --border: #1C2E48;
      --border2: #27405E;
      --gold: #F5B014;
      --gold2: #FFCC44;
      --gold3: #C8920F;
      --green: #22C55E;
      --red: #EF4444;
      --orange: #F97316;
      --blue: #3B82F6;
      --purple: #A855F7;
      --teal: #14B8A6;
      --t1: #EEF4FF;
      --t2: #8FA3C0;
      --t3: #4A5F7A;
      --t4: #273548;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      background: var(--bg0);
      color: var(--t1);
      min-height: 100vh;
      direction: rtl;
      font-size: 14px;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg0); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ── HEADER ─────────────────────────────── */
    .header {
      background: linear-gradient(180deg, var(--bg1) 0%, rgba(11,18,32,0.95) 100%);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(16px);
    }
    .header-inner {
      max-width: 1400px; margin: 0 auto;
      padding: 0 20px;
    }
    .header-top {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 14px 0; gap: 12px; flex-wrap: wrap;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-fc {
      background: linear-gradient(135deg, var(--gold2), var(--gold3));
      color: #000; font-weight: 900; font-size: 17px;
      padding: 5px 13px; border-radius: 8px; letter-spacing: -0.5px;
    }
    .logo-title {
      font-size: 20px; font-weight: 700;
      background: linear-gradient(90deg, var(--gold2), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; border: 1px solid;
      transition: all .3s;
    }
    .status-pill.online { color: var(--green); border-color: var(--green); background: rgba(34,197,94,.1); }
    .status-pill.offline { color: var(--t3); border-color: var(--border); background: rgba(255,255,255,.02); }
    .status-pill.syncing { color: var(--gold); border-color: var(--gold); background: rgba(245,176,20,.1); }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
    .online .dot { background: var(--green); animation: blink 1.8s infinite; }
    .offline .dot { background: var(--t4); }
    .syncing .dot { background: var(--gold); animation: blink .6s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .last-upd { font-size: 11px; color: var(--t3); white-space: nowrap; }
    .btn-refresh {
      display: flex; align-items: center; gap: 7px;
      background: linear-gradient(135deg, var(--gold), var(--gold3));
      color: #000; border: none; border-radius: 9px;
      padding: 8px 16px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all .2s;
      font-family: 'Vazirmatn', sans-serif;
    }
    .btn-refresh:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(245,176,20,.4); }
    .btn-refresh:active { transform: translateY(0); }
    .btn-refresh:disabled { opacity: .6; pointer-events: none; }
    .btn-refresh svg { transition: transform .3s; }
    .btn-refresh.spinning svg { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stats-bar {
      display: flex; gap: 20px; padding: 10px 0;
      border-top: 1px solid var(--border);
      overflow-x: auto; white-space: nowrap;
    }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat-lbl { color: var(--t3); font-size: 12px; }
    .stat-val { font-size: 13px; font-weight: 700; }
    .v-gold { color: var(--gold); }
    .v-green { color: var(--green); }
    .v-blue { color: var(--blue); }
    .v-orange { color: var(--orange); }

    /* ── MAIN ───────────────────────────────── */
    .main { max-width: 1400px; margin: 0 auto; padding: 20px; }

    /* Search */
    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-wrap svg {
      position: absolute; right: 15px; top: 50%;
      transform: translateY(-50%); color: var(--t3); pointer-events: none;
    }
    .search-input {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 46px 13px 14px;
      color: var(--t1); font-size: 14px;
      font-family: 'Vazirmatn', sans-serif;
      transition: border-color .2s, box-shadow .2s;
      direction: rtl;
    }
    .search-input:focus {
      outline: none; border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245,176,20,.12);
    }
    .search-input::placeholder { color: var(--t3); }

    /* Category tabs */
    .cat-tabs {
      display: flex; gap: 7px;
      overflow-x: auto; padding-bottom: 3px;
      margin-bottom: 12px;
    }
    .cat-tab {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 15px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent;
      color: var(--t2); font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: all .2s; font-family: 'Vazirmatn', sans-serif;
    }
    .cat-tab:hover { border-color: var(--border2); color: var(--t1); }
    .cat-tab.active { background: var(--gold); border-color: var(--gold); color: #000; }
    .cat-cnt {
      background: rgba(0,0,0,.2); border-radius: 9px;
      padding: 1px 6px; font-size: 10px;
    }
    .cat-tab.active .cat-cnt { background: rgba(0,0,0,.3); }

    /* Filter row */
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
    .f-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 13px; border-radius: 18px;
      border: 1px solid var(--border); background: transparent;
      color: var(--t2); font-size: 12px; cursor: pointer;
      transition: all .2s; font-family: 'Vazirmatn', sans-serif;
    }
    .f-btn:hover { border-color: var(--border2); color: var(--t1); }
    .f-btn.active { background: rgba(245,176,20,.1); border-color: var(--gold); color: var(--gold); }
    .sort-sel {
      padding: 6px 13px; border-radius: 18px;
      border: 1px solid var(--border); background: var(--bg2);
      color: var(--t2); font-size: 12px; cursor: pointer;
      font-family: 'Vazirmatn', sans-serif; direction: rtl;
    }

    /* Section row */
    .section-row {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 16px;
    }
    .section-title { font-size: 14px; color: var(--t2); font-weight: 600; }
    .section-cnt { font-size: 12px; color: var(--t3); }

    /* ── GRID ───────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 14px;
    }

    /* ── CARD ───────────────────────────────── */
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 15px; padding: 18px;
      transition: all .22s; position: relative; overflow: hidden;
    }
    .card::after {
      content: ''; position: absolute; top: 0; right: 0; left: 0;
      height: 2px; opacity: 0;
      background: linear-gradient(90deg, transparent, var(--cat-color, var(--gold)), transparent);
      transition: opacity .3s;
    }
    .card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.5); }
    .card:hover::after { opacity: 1; }
    .card.done { border-color: rgba(34,197,94,.25); background: linear-gradient(135deg, var(--bg2), rgba(34,197,94,.04)); }
    .card.fav { border-color: rgba(245,176,20,.25); }

    /* Card head */
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 13px; }
    .card-head-left { flex: 1; }
    .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 7px; }
    .badge {
      padding: 2px 9px; border-radius: 10px;
      font-size: 10px; font-weight: 700;
    }
    .b-weekly  { background: rgba(59,130,246,.18); color: #7EB8FF; }
    .b-daily   { background: rgba(168,85,247,.18);  color: #D4A0FF; }
    .b-milestone { background: rgba(245,176,20,.18); color: var(--gold); }
    .b-event   { background: rgba(239,68,68,.18);   color: #FF9090; }
    .b-seasonal { background: rgba(34,197,94,.18);  color: #6EE6A6; }
    .b-league  { background: rgba(20,184,166,.18);  color: #5EE0D4; }
    .b-easy    { background: rgba(34,197,94,.12);   color: #6EE6A6; }
    .b-medium  { background: rgba(245,176,20,.12);  color: var(--gold); }
    .b-hard    { background: rgba(239,68,68,.12);   color: #FF9090; }
    .b-done    { background: rgba(34,197,94,.15);   color: #6EE6A6; }
    .card-name { font-size: 15px; font-weight: 700; line-height: 1.35; }
    .fav-btn {
      background: none; border: none; cursor: pointer;
      font-size: 19px; line-height: 1; transition: transform .2s;
      flex-shrink: 0; margin-right: 8px;
    }
    .fav-btn:hover { transform: scale(1.25); }

    /* Reward */
    .reward-box {
      display: flex; align-items: center; gap: 11px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 11px; padding: 11px; margin-bottom: 13px;
    }
    .fut-card {
      width: 52px; height: 64px; border-radius: 7px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-weight: 900; flex-shrink: 0;
    }
    .fc-gold    { background: linear-gradient(145deg,#C8A230,#F0D050,#B0880A); color: #1A0E00; }
    .fc-silver  { background: linear-gradient(145deg,#888,#C4C4C4,#707070);     color: #111; }
    .fc-tots    { background: linear-gradient(145deg,#145C28,#2A9452,#0E3D1A);  color: #A0F0B0; }
    .fc-special { background: linear-gradient(145deg,#3A1468,#7030B8,#280D50);  color: #FFD700; }
    .fc-pack    { background: linear-gradient(145deg,#0A2040,#1A4080,#081830);  color: #80C0FF; }
    .fc-xp      { background: linear-gradient(145deg,#1A0830,#4A1080,#100620);  color: #E0A0FF; }
    .fc-rat { font-size: 17px; }
    .fc-pos { font-size: 8px; opacity: .8; margin-top: 1px; }
    .fc-icon { font-size: 22px; }
    .rew-info { flex: 1; }
    .rew-lbl { font-size: 10px; color: var(--t3); margin-bottom: 2px; }
    .rew-name { font-size: 13px; font-weight: 700; }
    .rew-sub { font-size: 11px; color: var(--t2); margin-top: 2px; }
    .rew-extras { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .rew-extra { font-size: 10px; font-weight: 700; color: var(--gold); }

    /* Requirements */
    .req-ttl { font-size: 10px; color: var(--t3); margin-bottom: 7px; letter-spacing: .4px; }
    .req-list { list-style: none; }
    .req-item {
      display: flex; align-items: flex-start; gap: 7px;
      font-size: 12px; color: var(--t2);
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,.03);
    }
    .req-item:last-child { border-bottom: none; }
    .req-dot { color: var(--gold); flex-shrink: 0; font-size: 14px; line-height: 1.2; }
    .req-mb { margin-bottom: 13px; }

    /* Progress */
    .prog-wrap { margin-bottom: 13px; }
    .prog-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--t2); margin-bottom: 5px; }
    .prog-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 2px; transition: width .5s; }
    .pf-green { background: var(--green); }
    .pf-gold  { background: var(--gold); }
    .pf-blue  { background: var(--blue); }

    /* Card footer */
    .card-foot {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 11px; border-top: 1px solid var(--border);
    }
    .expiry { display: flex; align-items: center; gap: 5px; font-size: 11px; }
    .exp-permanent { color: var(--t3); }
    .exp-ok   { color: var(--t3); }
    .exp-warn { color: var(--orange); }
    .exp-crit { color: var(--red); }
    .exp-gone { color: var(--red); }
    .done-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 7px;
      border: 1px solid var(--border); background: transparent;
      color: var(--t2); font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all .2s;
      font-family: 'Vazirmatn', sans-serif;
    }
    .done-btn:hover { border-color: var(--green); color: var(--green); background: rgba(34,197,94,.08); }
    .done-btn.checked { background: rgba(34,197,94,.1); border-color: var(--green); color: var(--green); }

    /* ── SOURCES ────────────────────────────── */
    .sources {
      display: flex; gap: 10px; align-items: center;
      margin-right: auto; font-size: 11px; color: var(--t3);
    }
    .src-link {
      color: var(--t3); text-decoration: none;
      border: 1px solid var(--border); padding: 3px 10px;
      border-radius: 12px; transition: all .2s;
    }
    .src-link:hover { color: var(--gold); border-color: var(--gold); }

    /* ── EMPTY ──────────────────────────────── */
    .empty { text-align: center; padding: 80px 20px; color: var(--t3); }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .4; }
    .empty h3 { font-size: 17px; color: var(--t2); margin-bottom: 8px; }
    .empty p  { font-size: 13px; }

    /* ── TOAST ──────────────────────────────── */
    #toasts {
      position: fixed; bottom: 20px; left: 20px;
      z-index: 100; display: flex; flex-direction: column; gap: 7px;
    }
    .toast {
      padding: 11px 15px; border-radius: 9px;
      font-size: 13px; font-weight: 500;
      max-width: 300px; animation: toastIn .3s ease;
      display: flex; align-items: center; gap: 9px;
    }
    .toast.s { background: rgba(34,197,94,.15); border: 1px solid var(--green); color: #6EE6A6; }
    .toast.e { background: rgba(239,68,68,.15);  border: 1px solid var(--red);   color: #FFA0A0; }
    .toast.i { background: rgba(59,130,246,.15); border: 1px solid var(--blue);  color: #90C0FF; }
    @keyframes toastIn { from{ transform:translateX(-110%);opacity:0 } to{ transform:translateX(0);opacity:1 } }

    /* ── HIGHLIGHT ──────────────────────────── */
    mark.hl { background: rgba(245,176,20,.3); border-radius: 2px; padding: 0 2px; color: inherit; }

    /* ── RESPONSIVE ─────────────────────────── */
    @media(max-width:700px) {
      .main { padding: 12px; }
      .grid { grid-template-columns: 1fr; }
      .header-inner { padding: 0 12px; }
      .logo-title { font-size: 16px; }
      .last-upd { display: none; }
    }
  </style>
</head>
<body>

<!-- TOASTS -->
<div id="toasts"></div>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <span class="logo-fc">FC26</span>
        <span class="logo-title">اهداف و چالش‌ها</span>
      </div>
      <div class="sources">
        منبع:
        <a class="src-link" href="https://www.futbin.com/objectives" target="_blank" rel="noopener">futbin.com</a>
        <a class="src-link" href="https://www.fut.gg/objectives"    target="_blank" rel="noopener">fut.gg</a>
      </div>
      <div class="header-right">
        <div class="status-pill offline" id="statusPill">
          <div class="dot"></div>
          <span id="statusTxt">آفلاین</span>
        </div>
        <span class="last-upd" id="lastUpd">—</span>
        <button class="btn-refresh" id="refreshBtn" onclick="doFetch()">
          <svg id="refreshIco" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
          بروزرسانی
        </button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat"><span class="stat-lbl">کل:</span>    <span class="stat-val v-gold"   id="sTotal">0</span></div>
      <div class="stat"><span class="stat-lbl">تکمیل:</span> <span class="stat-val v-green"  id="sDone">0</span></div>
      <div class="stat"><span class="stat-lbl">علاقه:</span> <span class="stat-val v-blue"   id="sFav">0</span></div>
      <div class="stat"><span class="stat-lbl">منقضی امروز:</span><span class="stat-val v-orange" id="sExpiring">0</span></div>
      <div class="stat"><span class="stat-lbl">پیشرفت فصل:</span>
        <span class="stat-val v-gold" id="sPct">۰٪</span>
      </div>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="main">
  <!-- Search -->
  <div class="search-wrap">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" class="search-input" id="searchInp"
      placeholder="جستجو در نام، شرایط، جایزه، ملیت..."
      oninput="render()" />
  </div>

  <!-- Category tabs -->
  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" data-cat="all"       onclick="setCat('all')">همه <span class="cat-cnt" id="cn-all">0</span></button>
    <button class="cat-tab"        data-cat="weekly"    onclick="setCat('weekly')">هفتگی <span class="cat-cnt" id="cn-weekly">0</span></button>
    <button class="cat-tab"        data-cat="daily"     onclick="setCat('daily')">روزانه <span class="cat-cnt" id="cn-daily">0</span></button>
    <button class="cat-tab"        data-cat="milestone" onclick="setCat('milestone')">مایل‌استون <span class="cat-cnt" id="cn-milestone">0</span></button>
    <button class="cat-tab"        data-cat="event"     onclick="setCat('event')">رویداد <span class="cat-cnt" id="cn-event">0</span></button>
    <button class="cat-tab"        data-cat="seasonal"  onclick="setCat('seasonal')">فصلی <span class="cat-cnt" id="cn-seasonal">0</span></button>
    <button class="cat-tab"        data-cat="league"    onclick="setCat('league')">رقابتی <span class="cat-cnt" id="cn-league">0</span></button>
  </div>

  <!-- Filters -->
  <div class="filter-row">
    <button class="f-btn" id="fb-fav"  onclick="toggleF('fav')">⭐ علاقه‌مندی‌ها</button>
    <button class="f-btn" id="fb-inc"  onclick="toggleF('inc')">⏳ تکمیل نشده</button>
    <button class="f-btn" id="fb-exp"  onclick="toggleF('exp')">🔥 در حال انقضا</button>
    <select class="sort-sel" id="sortSel" onchange="render()">
      <option value="def">مرتب‌سازی: پیش‌فرض</option>
      <option value="rew">جایزه: بالاترین</option>
      <option value="exp">انقضا: زودتر</option>
      <option value="dif">سختی: بیشتر</option>
      <option value="az">نام: الفبا</option>
    </select>
  </div>

  <!-- Section row -->
  <div class="section-row">
    <span class="section-title" id="secTitle">همه اهداف</span>
    <span class="section-cnt" id="secCnt"></span>
  </div>

  <!-- Grid -->
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="empty-icon">🔍</div>
    <h3>هدفی یافت نشد</h3>
    <p>جستجو یا فیلتر خود را تغییر دهید</p>
  </div>
</main>

<script>
/* ============================================================
   UTILITY
   ============================================================ */
function daysFromNow(d) {
  if (d == null) return null;
  return new Date(Date.now() + d * 864e5).toISOString();
}
function hoursFromNow(h) {
  return new Date(Date.now() + h * 36e5).toISOString();
}

/* ============================================================
   DATA
   ============================================================ */
const RAW = [
  /* ───── WEEKLY ───── */
  {id:'w01', cat:'weekly', catFA:'هفتگی', dif:'medium', difFA:'متوسط',
   name:'TOTW Weekly Challenge', nameFA:'چالش هفتگی تیم هفته',
   rew:{type:'player', name:'Rodri', nameFA:'رودری', rat:87, pos:'CM', nat:'اسپانیا', flag:'🇪🇸', club:'Man City', sp:false},
   reqs:[
     {fa:'۵ بازی را با بازیکنان تیم هفته ببر'},
     {fa:'۳ گل با بازیکنان تیم هفته بزن'},

/* ============================================================
   STATE
   ============================================================ */
let objectives = [];
let activeCat = 'all';
let filters = { fav: false, inc: false, exp: false };
let state = { favs: {}, done: {}, progs: {} };

function loadState() {
  try { const s = localStorage.getItem('fc26s'); if(s) state = JSON.parse(s); } catch(e){}
}
function saveState() {
  try { localStorage.setItem('fc26s', JSON.stringify(state)); } catch(e){}
}

/* ============================================================
   CATEGORY MAP
   ============================================================ */
const CAT_NAMES = { all:'همه اهداف', weekly:'اهداف هفتگی', daily:'اهداف روزانه', milestone:'مایل‌استون‌ها', event:'رویدادها', seasonal:'اهداف فصلی', league:'اهداف رقابتی' };
const CAT_COLOR = { weekly:'#7EB8FF', daily:'#D4A0FF', milestone:'#F5B014', event:'#FF9090', seasonal:'#6EE6A6', league:'#5EE0D4' };
const CAT_BADGE = { weekly:'b-weekly', daily:'b-daily', milestone:'b-milestone', event:'b-event', seasonal:'b-seasonal', league:'b-league' };

/* ============================================================
   EXPIRY
   ============================================================ */
function fmtExp(iso) {
  if (!iso) return { txt:'دائمی', cls:'exp-permanent', ico:'♾️' };
  const diff = new Date(iso) - Date.now();
  if (diff < 0) return { txt:'منقضی', cls:'exp-gone', ico:'❌' };
  const h = diff / 36e5;
  if (h < 6)  return { txt:`${Math.floor(h)}ساعت ${Math.floor((h%1)*60)}دقیقه`, cls:'exp-crit', ico:'🔥' };
  if (h < 24) return { txt:`${Math.floor(h)} ساعت دیگر`, cls:'exp-warn', ico:'⚠️' };
  const d = Math.floor(h/24);
  const rh = Math.floor(h%24);
  if (d < 3)  return { txt:`${d} روز ${rh} ساعت`, cls:'exp-warn', ico:'⚠️' };
  return { txt:`${d} روز دیگر`, cls:'exp-ok', ico:'📅' };
}

function isExpiring(obj) {
  if (!obj.exp) return false;
  return (new Date(obj.exp) - Date.now()) < 3 * 864e5;
}

/* ============================================================
   CARD STYLE
   ============================================================ */
function cardCls(rat, sp) {
  if (rat === 0) return 'fc-pack';
  if (sp) return 'fc-special';
  if (rat >= 94) return 'fc-tots';
  if (rat >= 84) return 'fc-gold';
  return 'fc-silver';
}

/* ============================================================
   HIGHLIGHT
   ============================================================ */
function hl(txt, q) {
  if (!q) return txt;
  return txt.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),
    '<mark class="hl">$1</mark>');
}

/* ============================================================
   RENDER ONE CARD
   ============================================================ */
function cardHTML(o, q) {
  const fav  = !!state.favs[o.id];
  const done = !!state.done[o.id];
  const prog = state.progs[o.id] ?? (o.prog ? o.prog.cur : null);
  const exp  = fmtExp(o.exp);
  const col  = CAT_COLOR[o.cat] || '#F5B014';

  /* Reward visual */
  let rewVis = '';
  const r = o.rew;
  if (r.type === 'xp') {
    rewVis = `<div class="fut-card fc-xp"><span class="fc-icon">⚡</span></div>`;
  } else if (r.type === 'pack') {
    rewVis = `<div class="fut-card fc-pack"><span class="fc-icon">📦</span></div>`;
  } else {
    rewVis = `<div class="fut-card ${cardCls(r.rat, r.sp)}">
      ${r.rat ? `<div class="fc-rat">${r.rat}</div><div class="fc-pos">${r.pos}</div>` : `<span class="fc-icon">🎁</span>`}
    </div>`;
  }

  /* Progress bar */
  let progHTML = '';
  if (o.prog || prog != null) {
    const max = o.prog?.max || 100;
    const cur = prog ?? 0;
    const pct = Math.min(100, Math.round(cur / max * 100));
    const pfCls = pct >= 100 ? 'pf-green' : pct >= 50 ? 'pf-gold' : 'pf-blue';
    progHTML = `<div class="prog-wrap">
      <div class="prog-head">
        <span>پیشرفت</span>
        <span>${cur.toLocaleString('fa-IR')} / ${max.toLocaleString('fa-IR')}</span>
      </div>
      <div class="prog-bar"><div class="prog-fill ${pfCls}" style="width:${pct}%"></div></div>
    </div>`;
  }

  return `<div class="card ${done?'done':''} ${fav?'fav':''}" id="c-${o.id}" style="--cat-color:${col}">
    <div class="card-head">
      <div class="card-head-left">
        <div class="badges">
          <span class="badge ${CAT_BADGE[o.cat]||'b-weekly'}">${hl(o.catFA,q)}</span>
          <span class="badge b-${o.dif}">${o.difFA}</span>
          ${done ? '<span class="badge b-done">✓ تکمیل</span>' : ''}
          ${isExpiring(o) && !done ? '<span class="badge" style="background:rgba(249,115,22,.18);color:#FFAC6A">🔥 منقضی می‌شود</span>' : ''}
        </div>
        <div class="card-name">${hl(o.nameFA, q)}</div>
      </div>
      <button class="fav-btn" onclick="toggleFav('${o.id}')" title="${fav?'حذف از علاقه‌مندی':'افزودن به علاقه‌مندی'}">${fav?'⭐':'☆'}</button>
    </div>

    <div class="reward-box">
      ${rewVis}
      <div class="rew-info">
        <div class="rew-lbl">جایزه</div>
        <div class="rew-name">${hl(r.nameFA, q)}</div>
        ${r.nat ? `<div class="rew-sub">${r.flag} ${hl(r.nat,q)} ${r.club ? '• '+r.club : ''}</div>` : ''}
        <div class="rew-extras">
          ${o.xp    ? `<span class="rew-extra">+${o.xp.toLocaleString('fa-IR')} XP</span>` : ''}
          ${o.coins ? `<span class="rew-extra">+${o.coins.toLocaleString('fa-IR')} سکه</span>` : ''}
        </div>
      </div>
    </div>

    <div class="req-mb">
      <div class="req-ttl">شرایط انجام</div>
      <ul class="req-list">
        ${o.reqs.map(r=>`<li class="req-item"><span class="req-dot">›</span><span>${hl(r.fa,q)}</span></li>`).join('')}
      </ul>
    </div>

    ${progHTML}

    <div class="card-foot">
      <div class="expiry ${exp.cls}"><span>${exp.ico}</span><span>${exp.txt}</span></div>
      <button class="done-btn ${done?'checked':''}" onclick="toggleDone('${o.id}')">
        ${done ? '✓ تکمیل شد' : '○ علامت‌گذاری'}
      </button>
    </div>
  </div>`;
}

/* ============================================================
   RENDER GRID
   ============================================================ */
function render() {
  const q   = document.getElementById('searchInp').value.toLowerCase().trim();
  const srt = document.getElementById('sortSel').value;
  const now = Date.now();

  let list = objectives.filter(o => {
    if (activeCat !== 'all' && o.cat !== activeCat) return false;
    if (filters.fav && !state.favs[o.id]) return false;
    if (filters.inc && state.done[o.id]) return false;
    if (filters.exp) {
      if (!o.exp) return false;
      if (new Date(o.exp) - now > 3 * 864e5) return false;
    }
    if (q) {
      const hay = [o.nameFA, o.name, o.catFA, o.rew.nameFA, o.rew.name, o.rew.nat, o.difFA,
        ...o.reqs.map(r=>r.fa)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const DMAP = { hard:3, medium:2, easy:1 };
  if (srt === 'rew') list.sort((a,b) => (b.rew.rat||0)-(a.rew.rat||0));
  else if (srt === 'exp') list.sort((a,b) => {
    if (!a.exp && !b.exp) return 0;
    if (!a.exp) return 1; if (!b.exp) return -1;
    return new Date(a.exp)-new Date(b.exp);
  });
  else if (srt === 'dif') list.sort((a,b) => DMAP[b.dif]-DMAP[a.dif]);
  else if (srt === 'az')  list.sort((a,b) => a.nameFA.localeCompare(b.nameFA,'fa'));

  document.getElementById('secTitle').textContent = CAT_NAMES[activeCat] || 'همه اهداف';
  document.getElementById('secCnt').textContent = list.length + ' هدف';

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (list.length === 0) { grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML = list.map(o => cardHTML(o, q)).join('');
}

/* ============================================================
   STATS
   ============================================================ */
function updateStats() {
  const total = objectives.length;
  const done  = Object.values(state.done).filter(Boolean).length;
  const favs  = Object.values(state.favs).filter(Boolean).length;
  const now   = Date.now();
  const expiring = objectives.filter(o => {
    if (!o.exp) return false;
    const d = new Date(o.exp)-now;
    return d>0 && d < 864e5;
  }).length;
  const pct = total ? Math.round(done/total*100) : 0;

  document.getElementById('sTotal').textContent    = total;
  document.getElementById('sDone').textContent     = done;
  document.getElementById('sFav').textContent      = favs;
  document.getElementById('sExpiring').textContent = expiring;
  document.getElementById('sPct').textContent      = pct + '٪';

  /* Category counts */
  ['all','weekly','daily','milestone','event','seasonal','league'].forEach(c => {
    const el = document.getElementById('cn-'+c);
    if (el) el.textContent = c==='all' ? total : objectives.filter(o=>o.cat===c).length;
  });
}

/* ============================================================
   TOGGLE HANDLERS
   ============================================================ */
function toggleFav(id) {
  state.favs[id] = !state.favs[id];
  saveState(); updateStats(); render();
  toast(state.favs[id] ? '⭐ به علاقه‌مندی‌ها اضافه شد' : '☆ از علاقه‌مندی حذف شد', 'i');
}

function toggleDone(id) {
  state.done[id] = !state.done[id];
  saveState(); updateStats(); render();
  if (state.done[id]) toast('✅ هدف تکمیل شد!', 's');
}

function setCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat===cat));
  render();
}

function toggleF(f) {
  filters[f] = !filters[f];
  document.getElementById('fb-'+f).classList.toggle('active', filters[f]);
  render();
}

/* ============================================================
   ONLINE FETCH
   ============================================================ */
function setStatus(mode) {
  const pill = document.getElementById('statusPill');
  const txt  = document.getElementById('statusTxt');
  pill.className = 'status-pill ' + mode;
  txt.textContent = mode==='online' ? 'آنلاین' : mode==='syncing' ? 'در حال بروزرسانی...' : 'آفلاین';
}

async function tryFetch(url, timeout=8000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP '+r.status);
    return r;
  } catch(e) { clearTimeout(timer); throw e; }
}

async function doFetch() {
  const btn = document.getElementById('refreshBtn');
  const ico = document.getElementById('refreshIco');
  btn.disabled = true;
  btn.classList.add('spinning');
  setStatus('syncing');

  let success = false;
  try {
    /* Try fut.gg API endpoints via CORS proxies */
    const targets = [
      `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.fut.gg/api/24/objectives/')}`,
      `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.fut.gg/objectives')}`,
      `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.futbin.com/objectives')}`
    ];

    for (const url of targets) {
      try {
        const res = await tryFetch(url);
        const json = await res.json();
        const content = json.contents || json;
        if (typeof content === 'string' && content.length > 1000) {
          const parsed = extractFromHTML(content);
          if (parsed && parsed.length > 0) {
            mergeData(parsed);
            success = true; break;
          }
        } else if (Array.isArray(content) && content.length > 0) {
          mergeData(content);
          success = true; break;
        }
      } catch(e) { /* try next */ }
    }
  } catch(e) {}

  const now = new Date();
  document.getElementById('lastUpd').textContent =
    'آخرین بروزرسانی: ' + now.toLocaleTimeString('fa-IR') + ' - ' + now.toLocaleDateString('fa-IR');

  if (success) {
    setStatus('online');
    toast('✅ داده‌های جدید دریافت شد', 's');
  } else {
    setStatus('online');
    toast('🔄 بروزرسانی شد (دیتای محلی)', 'i');
  }

  btn.disabled = false;
  btn.classList.remove('spinning');
  updateStats(); render();
}

function extractFromHTML(html) {
  /* Try to find JSON data in embedded scripts */
  const patterns = [
    /window\.__data\s*=\s*({[\s\S]+?});\s*<\/script>/,
    /window\.__INITIAL_STATE__\s*=\s*({[\s\S]+?});\s*<\/script>/,
    /"objectives"\s*:\s*(\[[\s\S]+?\])/,
    /\[\s*\{"id"[\s\S]+?\}\s*\]/
  ];
  for (const p of patterns) {
    const m = html.match(p);
    if (m) {
      try {
        const data = JSON.parse(m[1]);
        if (Array.isArray(data) && data.length) return data;
        if (data && data.objectives) return data.objectives;
      } catch(e){}
    }
  }
  return null;
}

function mergeData(newData) {
  /* Stub: in production would normalise API response to our schema */
  console.log('Received', newData.length, 'items from API');
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, type='i', ms=3200) {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ============================================================
   KEYBOARD SHORTCUT
   ============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInp').focus();
  }
  if (e.key === 'Escape') document.getElementById('searchInp').blur();
});

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadState();
  objectives = RAW;
  updateStats();
  render();
  setTimeout(doFetch, 800);
  setInterval(doFetch, 5 * 60 * 1000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
