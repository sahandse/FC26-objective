<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5B014" />
  <link rel="manifest" href="manifest.json" />
  <title>FC26 Hub | اهداف و SBC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0:#04090F; --bg1:#0B1220; --bg2:#101928; --bg3:#162235;
      --border:#1C2E48; --border2:#27405E;
      --gold:#F5B014; --gold2:#FFCC44; --gold3:#C8920F;
      --green:#22C55E; --red:#EF4444; --orange:#F97316;
      --blue:#3B82F6; --purple:#A855F7; --teal:#14B8A6;
      --t1:#EEF4FF; --t2:#8FA3C0; --t3:#4A5F7A; --t4:#273548;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg0);color:var(--t1);min-height:100vh;direction:rtl;font-size:14px}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:var(--bg0)}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

    /* HEADER */
    .header{background:linear-gradient(180deg,var(--bg1) 0%,rgba(11,18,32,.95) 100%);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(16px)}
    .header-inner{max-width:1400px;margin:0 auto;padding:0 20px}
    .header-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:12px;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-fc{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#000;font-weight:900;font-size:17px;padding:5px 13px;border-radius:8px;letter-spacing:-.5px}
    .logo-title{font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .status-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid;transition:all .3s}
    .status-pill.online{color:var(--green);border-color:var(--green);background:rgba(34,197,94,.1)}
    .status-pill.offline{color:var(--t3);border-color:var(--border);background:rgba(255,255,255,.02)}
    .status-pill.syncing{color:var(--gold);border-color:var(--gold);background:rgba(245,176,20,.1)}
    .dot{width:7px;height:7px;border-radius:50%}
    .online .dot{background:var(--green);animation:blink 1.8s infinite}
    .offline .dot{background:var(--t4)}
    .syncing .dot{background:var(--gold);animation:blink .6s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .last-upd{font-size:11px;color:var(--t3);white-space:nowrap}
    .btn-refresh{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#000;border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Vazirmatn',sans-serif}
    .btn-refresh:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(245,176,20,.4)}
    .btn-refresh:disabled{opacity:.6;pointer-events:none}
    .btn-refresh.spinning svg{animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .stats-bar{display:flex;gap:20px;padding:10px 0;border-top:1px solid var(--border);overflow-x:auto;white-space:nowrap}
    .stat{display:flex;align-items:center;gap:6px}
    .stat-lbl{color:var(--t3);font-size:12px}
    .stat-val{font-size:13px;font-weight:700}
    .v-gold{color:var(--gold)} .v-green{color:var(--green)} .v-blue{color:var(--blue)} .v-orange{color:var(--orange)}

    /* SECTION NAV */
    .sec-nav{display:flex;background:var(--bg1);border-bottom:2px solid var(--border);position:sticky;top:67px;z-index:49}
    .sec-btn{flex:1;max-width:220px;padding:13px 24px;background:none;border:none;border-bottom:3px solid transparent;color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;font-family:'Vazirmatn',sans-serif;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:-2px}
    .sec-btn:hover{color:var(--t1);background:rgba(255,255,255,.03)}
    .sec-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
    .sec-cnt-pill{background:rgba(245,176,20,.15);color:var(--gold);border-radius:10px;padding:1px 7px;font-size:11px}

    /* MAIN */
    .main{max-width:1400px;margin:0 auto;padding:20px}

    /* Search */
    .search-wrap{position:relative;margin-bottom:14px}
    .search-wrap svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
    .search-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px 46px 13px 14px;color:var(--t1);font-size:14px;font-family:'Vazirmatn',sans-serif;transition:border-color .2s,box-shadow .2s;direction:rtl}
    .search-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,176,20,.12)}
    .search-input::placeholder{color:var(--t3)}

    /* Category tabs */
    .cat-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px}
    .cat-tab{display:flex;align-items:center;gap:5px;padding:7px 15px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:'Vazirmatn',sans-serif}
    .cat-tab:hover{border-color:var(--border2);color:var(--t1)}
    .cat-tab.active{background:var(--gold);border-color:var(--gold);color:#000}
    .cat-cnt{background:rgba(0,0,0,.2);border-radius:9px;padding:1px 6px;font-size:10px}
    .cat-tab.active .cat-cnt{background:rgba(0,0,0,.3)}

    /* Filter row */
    .filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
    .f-btn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:18px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;transition:all .2s;font-family:'Vazirmatn',sans-serif}
    .f-btn:hover{border-color:var(--border2);color:var(--t1)}
    .f-btn.active{background:rgba(245,176,20,.1);border-color:var(--gold);color:var(--gold)}
    .sort-sel{padding:6px 13px;border-radius:18px;border:1px solid var(--border);background:var(--bg2);color:var(--t2);font-size:12px;cursor:pointer;font-family:'Vazirmatn',sans-serif;direction:rtl}

    /* Section row */
    .section-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .section-title{font-size:14px;color:var(--t2);font-weight:600}
    .section-cnt{font-size:12px;color:var(--t3)}

    /* Grid */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

    /* CARD */
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:15px;padding:18px;transition:all .22s;position:relative;overflow:hidden}
    .card::after{content:'';position:absolute;top:0;right:0;left:0;height:2px;opacity:0;background:linear-gradient(90deg,transparent,var(--cat-color,var(--gold)),transparent);transition:opacity .3s}
    .card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.5)}
    .card:hover::after{opacity:1}
    .card.done{border-color:rgba(34,197,94,.25);background:linear-gradient(135deg,var(--bg2),rgba(34,197,94,.04))}
    .card.fav{border-color:rgba(245,176,20,.25)}

    /* Card head */
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:13px}
    .card-head-left{flex:1}
    .badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
    .badge{padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700}
    .b-weekly{background:rgba(59,130,246,.18);color:#7EB8FF}
    .b-daily{background:rgba(168,85,247,.18);color:#D4A0FF}
    .b-milestone{background:rgba(245,176,20,.18);color:var(--gold)}
    .b-event{background:rgba(239,68,68,.18);color:#FF9090}
    .b-seasonal{background:rgba(34,197,94,.18);color:#6EE6A6}
    .b-league{background:rgba(20,184,166,.18);color:#5EE0D4}
    .b-easy{background:rgba(34,197,94,.12);color:#6EE6A6}
    .b-medium{background:rgba(245,176,20,.12);color:var(--gold)}
    .b-hard{background:rgba(239,68,68,.12);color:#FF9090}
    .b-done{background:rgba(34,197,94,.15);color:#6EE6A6}
    .b-iconic{background:rgba(168,85,247,.18);color:#D4A0FF}
    .b-foundation{background:rgba(20,184,166,.18);color:#5EE0D4}
    .b-totw{background:rgba(59,130,246,.18);color:#7EB8FF}
    .b-tots{background:rgba(245,176,20,.18);color:var(--gold)}
    .b-limited{background:rgba(239,68,68,.18);color:#FF9090}
    .card-name{font-size:15px;font-weight:700;line-height:1.35}
    .fav-btn{background:none;border:none;cursor:pointer;font-size:19px;line-height:1;transition:transform .2s;flex-shrink:0;margin-right:8px}
    .fav-btn:hover{transform:scale(1.25)}

    /* Reward box */
    .reward-box{display:flex;align-items:center;gap:11px;background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:11px;margin-bottom:13px}

    /* FUT Card */
    .fut-card{width:52px;height:64px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;position:relative;overflow:hidden}
    .fc-gold{background:linear-gradient(145deg,#C8A230,#F0D050,#B0880A);color:#1A0E00}
    .fc-silver{background:linear-gradient(145deg,#888,#C4C4C4,#707070);color:#111}
    .fc-tots{background:linear-gradient(145deg,#145C28,#2A9452,#0E3D1A);color:#A0F0B0}
    .fc-special{background:linear-gradient(145deg,#3A1468,#7030B8,#280D50);color:#FFD700}
    .fc-pack{background:linear-gradient(145deg,#0A2040,#1A4080,#081830);color:#80C0FF}
    .fc-xp{background:linear-gradient(145deg,#1A0830,#4A1080,#100620);color:#E0A0FF}
    .fc-rat{font-size:17px;z-index:2;position:relative}
    .fc-pos{font-size:8px;opacity:.8;margin-top:1px;z-index:2;position:relative}
    .fc-icon{font-size:22px}
    /* Player face image inside card */
    .fut-card .pface{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:52px;height:52px;object-fit:contain;object-position:bottom center;filter:drop-shadow(0 -2px 4px rgba(0,0,0,.5))}
    .fut-card .fc-overlay{position:absolute;top:3px;right:0;left:0;display:flex;flex-direction:column;align-items:center;z-index:3}

    .rew-info{flex:1}
    .rew-lbl{font-size:10px;color:var(--t3);margin-bottom:2px}
    .rew-name{font-size:13px;font-weight:700}
    .rew-sub{font-size:11px;color:var(--t2);margin-top:2px}
    .rew-extras{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
    .rew-extra{font-size:10px;font-weight:700;color:var(--gold)}

    /* Requirements */
    .req-ttl{font-size:10px;color:var(--t3);margin-bottom:7px;letter-spacing:.4px}
    .req-list{list-style:none}
    .req-item{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--t2);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
    .req-item:last-child{border-bottom:none}
    .req-dot{color:var(--gold);flex-shrink:0;font-size:14px;line-height:1.2}
    .req-mb{margin-bottom:13px}

    /* SBC requirements */
    .sbc-reqs{margin-bottom:13px}
    .sbc-req-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
    .sbc-req-row:last-child{border-bottom:none}
    .sbc-req-label{color:var(--t3)}
    .sbc-req-val{color:var(--t1);font-weight:600;background:var(--bg3);padding:2px 8px;border-radius:6px;font-size:11px}

    /* SBC Guide */
    .sbc-guide{margin-bottom:13px}
    .sbc-guide-btn{width:100%;padding:8px 12px;background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.2);border-radius:8px;color:#7EB8FF;font-size:12px;font-weight:600;cursor:pointer;font-family:'Vazirmatn',sans-serif;text-align:right;transition:all .2s;display:flex;align-items:center;gap:6px}
    .sbc-guide-btn:hover{background:rgba(59,130,246,.14)}
    .sbc-guide-body{display:none;margin-top:8px;padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--t2);line-height:1.85}
    .sbc-guide-body.open{display:block}

    /* Cost pill */
    .sbc-cost-pill{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--green);font-weight:700}

    /* Progress */
    .prog-wrap{margin-bottom:13px}
    .prog-head{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:5px}
    .prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
    .prog-fill{height:100%;border-radius:2px;transition:width .5s}
    .pf-green{background:var(--green)} .pf-gold{background:var(--gold)} .pf-blue{background:var(--blue)}

    /* Card footer */
    .card-foot{display:flex;justify-content:space-between;align-items:center;padding-top:11px;border-top:1px solid var(--border)}
    .expiry{display:flex;align-items:center;gap:5px;font-size:11px}
    .exp-permanent{color:var(--t3)} .exp-ok{color:var(--t3)} .exp-warn{color:var(--orange)} .exp-crit{color:var(--red)} .exp-gone{color:var(--red)}
    .done-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Vazirmatn',sans-serif}
    .done-btn:hover{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.08)}
    .done-btn.checked{background:rgba(34,197,94,.1);border-color:var(--green);color:var(--green)}

    /* Sources */
    .sources{display:flex;gap:10px;align-items:center;margin-right:auto;font-size:11px;color:var(--t3)}
    .src-link{color:var(--t3);text-decoration:none;border:1px solid var(--border);padding:3px 10px;border-radius:12px;transition:all .2s}
    .src-link:hover{color:var(--gold);border-color:var(--gold)}

    /* Empty */
    .empty{text-align:center;padding:80px 20px;color:var(--t3)}
    .empty-icon{font-size:48px;margin-bottom:16px;opacity:.4}
    .empty h3{font-size:17px;color:var(--t2);margin-bottom:8px}
    .empty p{font-size:13px}

    /* Toast */
    #toasts{position:fixed;bottom:20px;left:20px;z-index:100;display:flex;flex-direction:column;gap:7px}
    .toast{padding:11px 15px;border-radius:9px;font-size:13px;font-weight:500;max-width:300px;animation:toastIn .3s ease;display:flex;align-items:center;gap:9px}
    .toast.s{background:rgba(34,197,94,.15);border:1px solid var(--green);color:#6EE6A6}
    .toast.e{background:rgba(239,68,68,.15);border:1px solid var(--red);color:#FFA0A0}
    .toast.i{background:rgba(59,130,246,.15);border:1px solid var(--blue);color:#90C0FF}
    @keyframes toastIn{from{transform:translateX(-110%);opacity:0}to{transform:translateX(0);opacity:1}}
    mark.hl{background:rgba(245,176,20,.3);border-radius:2px;padding:0 2px;color:inherit}

    @media(max-width:700px){
      .main{padding:12px}
      .grid{grid-template-columns:1fr}
      .header-inner{padding:0 12px}
      .logo-title{font-size:16px}
      .last-upd{display:none}
    }
  </style>
</head>
<body>

<div id="toasts"></div>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <span class="logo-fc">FC26</span>
        <span class="logo-title">اهداف و SBC</span>
      </div>
      <div class="sources">
        منبع:
        <a class="src-link" href="https://www.fut.gg/sbc/" target="_blank" rel="noopener">fut.gg/sbc</a>
        <a class="src-link" href="https://www.futbin.com/objectives" target="_blank" rel="noopener">futbin.com</a>
      </div>
      <div class="header-right">
        <div class="status-pill offline" id="statusPill">
          <div class="dot"></div>
          <span id="statusTxt">آفلاین</span>
        </div>
        <span class="last-upd" id="lastUpd">—</span>
        <button class="btn-refresh" id="refreshBtn" onclick="doFetch()">
          <svg id="refreshIco" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
          بروزرسانی
        </button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat"><span class="stat-lbl">اهداف:</span><span class="stat-val v-gold" id="sTotal">0</span></div>
      <div class="stat"><span class="stat-lbl">تکمیل اهداف:</span><span class="stat-val v-green" id="sDone">0</span></div>
      <div class="stat"><span class="stat-lbl">SBC:</span><span class="stat-val v-blue" id="sSBCTotal">0</span></div>
      <div class="stat"><span class="stat-lbl">SBC تکمیل:</span><span class="stat-val v-green" id="sSBCDone">0</span></div>
      <div class="stat"><span class="stat-lbl">علاقه‌مندی:</span><span class="stat-val v-blue" id="sFav">0</span></div>
      <div class="stat"><span class="stat-lbl">منقضی امروز:</span><span class="stat-val v-orange" id="sExpiring">0</span></div>
    </div>
  </div>
</header>

<!-- SECTION NAV -->
<div class="sec-nav">
  <button class="sec-btn active" id="sn-obj" onclick="showSec('obj')">
    🎯 اهداف <span class="sec-cnt-pill" id="sp-obj">0</span>
  </button>
  <button class="sec-btn" id="sn-sbc" onclick="showSec('sbc')">
    ⚗️ SBC <span class="sec-cnt-pill" id="sp-sbc">0</span>
  </button>
</div>

<!-- ═══ OBJECTIVES SECTION ═══ -->
<main class="main" id="sec-obj">
  <div class="search-wrap">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" class="search-input" id="objSearch" placeholder="جستجو در اهداف، شرایط، جایزه..." oninput="renderObj()" />
  </div>
  <div class="cat-tabs" id="objCatTabs">
    <button class="cat-tab active" data-cat="all"       onclick="setObjCat('all')">همه <span class="cat-cnt" id="ocn-all">0</span></button>
    <button class="cat-tab"        data-cat="weekly"    onclick="setObjCat('weekly')">هفتگی <span class="cat-cnt" id="ocn-weekly">0</span></button>
    <button class="cat-tab"        data-cat="daily"     onclick="setObjCat('daily')">روزانه <span class="cat-cnt" id="ocn-daily">0</span></button>
    <button class="cat-tab"        data-cat="milestone" onclick="setObjCat('milestone')">مایل‌استون <span class="cat-cnt" id="ocn-milestone">0</span></button>
    <button class="cat-tab"        data-cat="event"     onclick="setObjCat('event')">رویداد <span class="cat-cnt" id="ocn-event">0</span></button>
    <button class="cat-tab"        data-cat="seasonal"  onclick="setObjCat('seasonal')">فصلی <span class="cat-cnt" id="ocn-seasonal">0</span></button>
    <button class="cat-tab"        data-cat="league"    onclick="setObjCat('league')">رقابتی <span class="cat-cnt" id="ocn-league">0</span></button>
  </div>
  <div class="filter-row">
    <button class="f-btn" id="ofb-fav" onclick="toggleOF('fav')">⭐ علاقه‌مندی‌ها</button>
    <button class="f-btn" id="ofb-inc" onclick="toggleOF('inc')">⏳ تکمیل نشده</button>
    <button class="f-btn" id="ofb-exp" onclick="toggleOF('exp')">🔥 در حال انقضا</button>
    <select class="sort-sel" id="objSort" onchange="renderObj()">
      <option value="def">مرتب‌سازی: پیش‌فرض</option>
      <option value="rew">جایزه: بالاترین</option>
      <option value="exp">انقضا: زودتر</option>
      <option value="dif">سختی: بیشتر</option>
      <option value="az">نام: الفبا</option>
    </select>
  </div>
  <div class="section-row">
    <span class="section-title" id="objSecTitle">همه اهداف</span>
    <span class="section-cnt" id="objSecCnt"></span>

<script>
/* ── UTILS ── */
function daysFromNow(d){return new Date(Date.now()+d*864e5).toISOString();}
function hoursFromNow(h){return new Date(Date.now()+h*36e5).toISOString();}
function fmtExp(iso){
  if(!iso)return{txt:'دائمی',cls:'exp-permanent',ico:'♾️'};
  const diff=new Date(iso)-Date.now();
  if(diff<0)return{txt:'منقضی',cls:'exp-gone',ico:'❌'};
  const h=diff/36e5;
  if(h<6) return{txt:`${Math.floor(h)}ساعت ${Math.floor((h%1)*60)}دقیقه`,cls:'exp-crit',ico:'🔥'};
  if(h<24)return{txt:`${Math.floor(h)} ساعت دیگر`,cls:'exp-warn',ico:'⚠️'};
  const d=Math.floor(h/24),rh=Math.floor(h%24);
  if(d<3) return{txt:`${d} روز ${rh} ساعت`,cls:'exp-warn',ico:'⚠️'};
  return{txt:`${d} روز دیگر`,cls:'exp-ok',ico:'📅'};
}
function isExpiring(o){if(!o.exp)return false;return(new Date(o.exp)-Date.now())<3*864e5;}
function cardCls(rat,sp){
  if(rat===0)return'fc-pack';
  if(sp)return'fc-special';
  if(rat>=94)return'fc-tots';
  if(rat>=84)return'fc-gold';
  return'fc-silver';
}
function hl(txt,q){
  if(!q)return txt;
  return txt.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<mark class="hl">$1</mark>');
}

   guide:'یک تیم از ۴ لیگ مختلف بسازید. مثلاً ۳ بازیکن از لیگ برتر، ۳ از لالیگا، ۳ از بوندسلیگا و ۲ از سری‌آ. امتیاز پایین است پس بازیکنان ارزان کافی است.',
   cost:35000,costFA:'۳۵,۰۰۰ سکه',exp:null,xp:1000,coins:2500},

  {id:'sbc15',cat:'tots',catFA:'TOTS',dif:'hard',difFA:'سخت',
   name:'TOTS World XI',nameFA:'تیم جهانی TOTS',
   rew:{type:'player',name:'TOTS World XI Pick',nameFA:'انتخاب تیم جهانی TOTS',rat:94,pos:'PICK',nat:'',flag:'',club:'',sp:true},
   reqs:[{label:'تعداد بازیکنان',val:'۱۱ بازیکن'},{label:'امتیاز تیم',val:'حداقل ۸۶'},{label:'شیمی',val:'حداقل ۲۲'},{label:'بازیکن TOTS',val:'حداقل ۱ بازیکن TOTS'},{label:'لیگ',val:'حداکثر ۳ لیگ'}],
   guide:'سخت‌ترین SBC. یک بازیکن TOTS در تیم نیاز دارید. تیمی با امتیاز ۸۶+ از حداکثر ۳ لیگ. بهترین راه ترکیب لیگ برتر + لالیگا + بوندسلیگا با یک بازیکن TOTS ارزان‌تر است.',
   cost:1500000,costFA:'۱,۵۰۰,۰۰۰ سکه',exp:daysFromNow(14),xp:8000,coins:0}
];

/* ── STATE ── */
let state={objFavs:{},objDone:{},objProgs:{},sbcFavs:{},sbcDone:{}};
let objCat='all',objFilters={fav:false,inc:false,exp:false};
let sbcCat='all',sbcFilters={fav:false,inc:false,exp:false};

function loadState(){try{const s=localStorage.getItem('fc26hub2');if(s)state=JSON.parse(s);}catch(e){}}
function saveState(){try{localStorage.setItem('fc26hub2',JSON.stringify(state));}catch(e){}}

/* ── OBJECTIVE CARD ── */
const OBJ_CAT_NAMES={all:'همه اهداف',weekly:'اهداف هفتگی',daily:'اهداف روزانه',milestone:'مایل‌استون‌ها',event:'رویدادها',seasonal:'اهداف فصلی',league:'اهداف رقابتی'};
const OBJ_CAT_COLOR={weekly:'#7EB8FF',daily:'#D4A0FF',milestone:'#F5B014',event:'#FF9090',seasonal:'#6EE6A6',league:'#5EE0D4'};
const OBJ_CAT_BADGE={weekly:'b-weekly',daily:'b-daily',milestone:'b-milestone',event:'b-event',seasonal:'b-seasonal',league:'b-league'};

function objCardHTML(o,q){
  const fav=!!state.objFavs[o.id],done=!!state.objDone[o.id];
  const prog=state.objProgs[o.id]??(o.prog?o.prog.cur:null);
  const exp=fmtExp(o.exp),col=OBJ_CAT_COLOR[o.cat]||'#F5B014',r=o.rew;
  let rewVis=r.type==='xp'?`<div class="fut-card fc-xp"><span class="fc-icon">⚡</span></div>`:
    r.type==='pack'?`<div class="fut-card fc-pack"><span class="fc-icon">📦</span></div>`:
    playerFUT(r.name,r.rat,r.pos,r.sp);
  let progHTML='';
  if(o.prog||prog!=null){
    const max=o.prog?.max||100,cur=prog??0,pct=Math.min(100,Math.round(cur/max*100));
    const pfCls=pct>=100?'pf-green':pct>=50?'pf-gold':'pf-blue';
    progHTML=`<div class="prog-wrap"><div class="prog-head"><span>پیشرفت</span><span>${cur.toLocaleString('fa-IR')} / ${max.toLocaleString('fa-IR')}</span></div><div class="prog-bar"><div class="prog-fill ${pfCls}" style="width:${pct}%"></div></div></div>`;
  }
  return `<div class="card ${done?'done':''} ${fav?'fav':''}" id="oc-${o.id}" style="--cat-color:${col}">
    <div class="card-head">
      <div class="card-head-left">
        <div class="badges">
          <span class="badge ${OBJ_CAT_BADGE[o.cat]||'b-weekly'}">${hl(o.catFA,q)}</span>
          <span class="badge b-${o.dif}">${o.difFA}</span>
          ${done?'<span class="badge b-done">✓ تکمیل</span>':''}
          ${isExpiring(o)&&!done?'<span class="badge" style="background:rgba(249,115,22,.18);color:#FFAC6A">🔥 منقضی می‌شود</span>':''}
        </div>
        <div class="card-name">${hl(o.nameFA,q)}</div>
      </div>
      <button class="fav-btn" onclick="toggleObjFav('${o.id}')">${fav?'⭐':'☆'}</button>
    </div>
    <div class="reward-box">${rewVis}
      <div class="rew-info">
        <div class="rew-lbl">جایزه</div>
        <div class="rew-name">${hl(r.nameFA,q)}</div>
        ${r.nat?`<div class="rew-sub">${r.flag} ${hl(r.nat,q)}${r.club?' • '+r.club:''}</div>`:''}
        <div class="rew-extras">
          ${o.xp?`<span class="rew-extra">+${o.xp.toLocaleString('fa-IR')} XP</span>`:''}
          ${o.coins?`<span class="rew-extra">+${o.coins.toLocaleString('fa-IR')} سکه</span>`:''}
        </div>
      </div>
    </div>
    <div class="req-mb"><div class="req-ttl">شرایط انجام</div>
      <ul class="req-list">${o.reqs.map(r=>`<li class="req-item"><span class="req-dot">›</span><span>${hl(r.fa,q)}</span></li>`).join('')}</ul>
    </div>
    ${progHTML}
    <div class="card-foot">
      <div class="expiry ${exp.cls}"><span>${exp.ico}</span><span>${exp.txt}</span></div>
      <button class="done-btn ${done?'checked':''}" onclick="toggleObjDone('${o.id}')">${done?'✓ تکمیل شد':'○ علامت‌گذاری'}</button>
    </div>
  </div>`;
}

/* ── SBC CARD ── */
const SBC_CAT_NAMES={all:'همه SBC‌ها',iconic:'SBC آیکونیک',foundation:'SBC پایه',league:'SBC لیگ',tots:'SBC - TOTS',limited:'SBC محدود'};
const SBC_CAT_COLOR={iconic:'#D4A0FF',foundation:'#5EE0D4',league:'#7EB8FF',tots:'#F5B014',limited:'#FF9090'};
const SBC_CAT_BADGE={iconic:'b-iconic',foundation:'b-foundation',league:'b-league',tots:'b-tots',limited:'b-limited'};

function sbcCardHTML(s,q){
  const fav=!!state.sbcFavs[s.id],done=!!state.sbcDone[s.id];
  const exp=fmtExp(s.exp),col=SBC_CAT_COLOR[s.cat]||'#A855F7',r=s.rew;
  const rewVis=r.type==='pack'?`<div class="fut-card fc-pack"><span class="fc-icon">📦</span></div>`:playerFUT(r.name,r.rat,r.pos,r.sp);
  const reqs=s.reqs.map(req=>`<div class="sbc-req-row"><span class="sbc-req-label">${hl(req.label,q)}</span><span class="sbc-req-val">${hl(req.val,q)}</span></div>`).join('');
  const gid=`g-${s.id}`;
  return `<div class="card ${done?'done':''} ${fav?'fav':''}" id="sc-${s.id}" style="--cat-color:${col}">
    <div class="card-head">
      <div class="card-head-left">
        <div class="badges">
          <span class="badge ${SBC_CAT_BADGE[s.cat]||'b-iconic'}">${hl(s.catFA,q)}</span>
          <span class="badge b-${s.dif}">${s.difFA}</span>
          ${done?'<span class="badge b-done">✓ تکمیل</span>':''}
          ${isExpiring(s)&&!done?'<span class="badge" style="background:rgba(249,115,22,.18);color:#FFAC6A">🔥 منقضی می‌شود</span>':''}
        </div>
        <div class="card-name">${hl(s.nameFA,q)}</div>
      </div>
      <button class="fav-btn" onclick="toggleSBCFav('${s.id}')">${fav?'⭐':'☆'}</button>
    </div>
    <div class="reward-box">${rewVis}
      <div class="rew-info">
        <div class="rew-lbl">جایزه</div>
        <div class="rew-name">${hl(r.nameFA,q)}</div>
        ${r.nat?`<div class="rew-sub">${r.flag} ${hl(r.nat,q)}${r.club?' • '+r.club:''}</div>`:''}
        <div class="rew-extras">
          ${s.xp?`<span class="rew-extra">+${s.xp.toLocaleString('fa-IR')} XP</span>`:''}
          ${s.coins?`<span class="rew-extra">+${s.coins.toLocaleString('fa-IR')} سکه</span>`:''}
        </div>
      </div>
    </div>
    <div class="sbc-reqs"><div class="req-ttl">شرایط SBC</div>${reqs}</div>
    <div class="sbc-guide">
      <button class="sbc-guide-btn" onclick="toggleGuide('${gid}')">📖 راهنمای انجام SBC ▾</button>
      <div class="sbc-guide-body" id="${gid}">${hl(s.guide,q)}</div>
    </div>
    <div class="card-foot">
      <div style="display:flex;gap:12px;align-items:center">
        <div class="expiry ${exp.cls}"><span>${exp.ico}</span><span>${exp.txt}</span></div>
        ${s.costFA?`<div class="sbc-cost-pill">💰 ${s.costFA}</div>`:''}
      </div>
      <button class="done-btn ${done?'checked':''}" onclick="toggleSBCDone('${s.id}')">${done?'✓ تکمیل شد':'○ علامت‌گذاری'}</button>
    </div>
  </div>`;
}

function toggleGuide(id){const el=document.getElementById(id);if(el)el.classList.toggle('open');}

/* ── RENDER OBJECTIVES ── */
function renderObj(){
  const q=document.getElementById('objSearch').value.toLowerCase().trim();
  const srt=document.getElementById('objSort').value,now=Date.now();
  let list=OBJ_RAW.filter(o=>{
    if(objCat!=='all'&&o.cat!==objCat)return false;
    if(objFilters.fav&&!state.objFavs[o.id])return false;
    if(objFilters.inc&&state.objDone[o.id])return false;
    if(objFilters.exp){if(!o.exp)return false;if(new Date(o.exp)-now>3*864e5)return false;}
    if(q){const hay=[o.nameFA,o.name,o.catFA,o.rew.nameFA,o.rew.nat,o.difFA,...o.reqs.map(r=>r.fa)].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  const DM={hard:3,medium:2,easy:1};
  if(srt==='rew')list.sort((a,b)=>(b.rew.rat||0)-(a.rew.rat||0));
  else if(srt==='exp')list.sort((a,b)=>{if(!a.exp&&!b.exp)return 0;if(!a.exp)return 1;if(!b.exp)return -1;return new Date(a.exp)-new Date(b.exp);});
  else if(srt==='dif')list.sort((a,b)=>DM[b.dif]-DM[a.dif]);
  else if(srt==='az')list.sort((a,b)=>a.nameFA.localeCompare(b.nameFA,'fa'));
  document.getElementById('objSecTitle').textContent=OBJ_CAT_NAMES[objCat]||'همه اهداف';
  document.getElementById('objSecCnt').textContent=list.length+' هدف';
  const g=document.getElementById('objGrid'),e=document.getElementById('objEmpty');
  if(!list.length){g.innerHTML='';e.style.display='block';return;}
  e.style.display='none';g.innerHTML=list.map(o=>objCardHTML(o,q)).join('');
}

/* ── RENDER SBC ── */
function renderSBC(){
  const q=document.getElementById('sbcSearch').value.toLowerCase().trim();
  const srt=document.getElementById('sbcSort').value,now=Date.now();
  let list=SBC_RAW.filter(s=>{
    if(sbcCat!=='all'&&s.cat!==sbcCat)return false;
    if(sbcFilters.fav&&!state.sbcFavs[s.id])return false;
    if(sbcFilters.inc&&state.sbcDone[s.id])return false;
    if(sbcFilters.exp){if(!s.exp)return false;if(new Date(s.exp)-now>3*864e5)return false;}
    if(q){const hay=[s.nameFA,s.name,s.catFA,s.rew.nameFA,s.rew.nat,s.difFA,...s.reqs.map(r=>r.label+' '+r.val),s.guide].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  const DM={hard:3,medium:2,easy:1};
  if(srt==='rew')list.sort((a,b)=>(b.rew.rat||0)-(a.rew.rat||0));
  else if(srt==='cost')list.sort((a,b)=>(a.cost||0)-(b.cost||0));
  else if(srt==='exp')list.sort((a,b)=>{if(!a.exp&&!b.exp)return 0;if(!a.exp)return 1;if(!b.exp)return -1;return new Date(a.exp)-new Date(b.exp);});
  else if(srt==='dif')list.sort((a,b)=>DM[b.dif]-DM[a.dif]);
  document.getElementById('sbcSecTitle').textContent=SBC_CAT_NAMES[sbcCat]||'همه SBC‌ها';
  document.getElementById('sbcSecCnt').textContent=list.length+' SBC';
  const g=document.getElementById('sbcGrid'),e=document.getElementById('sbcEmpty');
  if(!list.length){g.innerHTML='';e.style.display='block';return;}
  e.style.display='none';g.innerHTML=list.map(s=>sbcCardHTML(s,q)).join('');
}

/* ── STATS ── */
function updateStats(){
  const ot=OBJ_RAW.length,od=Object.values(state.objDone).filter(Boolean).length;
  const st=SBC_RAW.length,sd=Object.values(state.sbcDone).filter(Boolean).length;
  const fav=Object.values(state.objFavs).filter(Boolean).length+Object.values(state.sbcFavs).filter(Boolean).length;
  const now=Date.now(),exp=OBJ_RAW.filter(o=>{if(!o.exp)return false;const d=new Date(o.exp)-now;return d>0&&d<864e5;}).length;
  document.getElementById('sTotal').textContent=ot;
  document.getElementById('sDone').textContent=od;
  document.getElementById('sSBCTotal').textContent=st;
  document.getElementById('sSBCDone').textContent=sd;
  document.getElementById('sFav').textContent=fav;
  document.getElementById('sExpiring').textContent=exp;
  document.getElementById('sp-obj').textContent=ot;
  document.getElementById('sp-sbc').textContent=st;
  ['all','weekly','daily','milestone','event','seasonal','league'].forEach(c=>{
    const el=document.getElementById('ocn-'+c);if(el)el.textContent=c==='all'?ot:OBJ_RAW.filter(o=>o.cat===c).length;
  });
  ['all','iconic','foundation','league','tots','limited'].forEach(c=>{
    const el=document.getElementById('scn-'+c);if(el)el.textContent=c==='all'?st:SBC_RAW.filter(s=>s.cat===c).length;
  });
}

/* ── SECTION SWITCH ── */
function showSec(sec){
  ['obj','sbc'].forEach(s=>{
    document.getElementById('sec-'+s).style.display=s===sec?'block':'none';
    document.getElementById('sn-'+s).classList.toggle('active',s===sec);
  });
}

/* ── CATEGORY & FILTER ── */
function setObjCat(cat){objCat=cat;document.querySelectorAll('#objCatTabs .cat-tab').forEach(t=>t.classList.toggle('active',t.dataset.cat===cat));renderObj();}
function setSBCCat(cat){sbcCat=cat;document.querySelectorAll('#sbcCatTabs .cat-tab').forEach(t=>t.classList.toggle('active',t.dataset.cat===cat));renderSBC();}
function toggleOF(f){objFilters[f]=!objFilters[f];document.getElementById('ofb-'+f).classList.toggle('active',objFilters[f]);renderObj();}
function toggleSF(f){sbcFilters[f]=!sbcFilters[f];document.getElementById('sfb-'+f).classList.toggle('active',sbcFilters[f]);renderSBC();}
function toggleObjFav(id){state.objFavs[id]=!state.objFavs[id];saveState();updateStats();renderObj();toast(state.objFavs[id]?'⭐ اضافه شد':'☆ حذف شد','i');}
function toggleSBCFav(id){state.sbcFavs[id]=!state.sbcFavs[id];saveState();updateStats();renderSBC();toast(state.sbcFavs[id]?'⭐ اضافه شد':'☆ حذف شد','i');}
function toggleObjDone(id){state.objDone[id]=!state.objDone[id];saveState();updateStats();renderObj();if(state.objDone[id])toast('✅ هدف تکمیل شد!','s');}
function toggleSBCDone(id){state.sbcDone[id]=!state.sbcDone[id];saveState();updateStats();renderSBC();if(state.sbcDone[id])toast('✅ SBC تکمیل شد!','s');}

/* ── FETCH (manual only) ── */
function setStatus(m){
  const p=document.getElementById('statusPill'),t=document.getElementById('statusTxt');
  p.className='status-pill '+m;
  t.textContent=m==='online'?'آنلاین':m==='syncing'?'در حال بروزرسانی...':'آفلاین';
}
async function doFetch(){
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true;btn.classList.add('spinning');setStatus('syncing');
  let ok=false;
  try{
    const res=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.fut.gg/sbc/')}`,{signal:AbortSignal.timeout(8000)});
    const j=await res.json();if((j.contents||'').length>500)ok=true;
  }catch(e){}
  document.getElementById('lastUpd').textContent='آخرین: '+new Date().toLocaleTimeString('fa-IR');
  setStatus('online');
  toast(ok?'✅ داده‌های جدید دریافت شد':'🔄 بروزرسانی شد (دیتای محلی)','i');
  btn.disabled=false;btn.classList.remove('spinning');
}

/* ── TOAST ── */
function toast(msg,type='i',ms=3000){
  const c=document.getElementById('toasts'),el=document.createElement('div');
  el.className='toast '+type;el.textContent=msg;c.appendChild(el);
  setTimeout(()=>el.remove(),ms);
}

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('objSearch').focus();}
  if(e.key==='Escape'){document.getElementById('objSearch').blur();document.getElementById('sbcSearch').blur();}
});

/* ── INIT ── */
function init(){
  loadState();updateStats();renderObj();renderSBC();
  setTimeout(doFetch,1000);
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
